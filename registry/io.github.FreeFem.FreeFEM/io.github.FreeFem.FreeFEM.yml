id: io.github.FreeFem.FreeFEM
# The numerical solvers come from upstream; X11/OpenGL use the runtime.
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: freefem
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Upstream's GLUT plotter uses X11, including through Xwayland.
  - --socket=x11
  - --share=ipc
  # OpenGL plots.
  - --device=dri
  # Scripts and simulation output in Documents.
  - --filesystem=xdg-documents
modules:
  - name: freefem
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 freefem-wrapper /app/bin/freefem
      - install -Dm755 freefem-wrapper /app/bin/freefem-mpi
      - install -Dm644 io.github.FreeFem.FreeFEM.desktop /app/share/applications/io.github.FreeFem.FreeFEM.desktop
      - install -Dm644 io.github.FreeFem.FreeFEM.metainfo.xml /app/share/metainfo/io.github.FreeFem.FreeFEM.metainfo.xml
      - install -Dm644 io.github.FreeFem.FreeFEM.svg /app/share/icons/hicolor/scalable/apps/io.github.FreeFem.FreeFEM.svg
